<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="18" y="24" width="92" height="58" rx="4"/>
    </clipPath>
  </defs>

  <!-- stand -->
  <path d="M54 92h20l4 14H50z" fill="#3d3846"/>
  <rect x="40" y="104" width="48" height="8" rx="4" fill="#241f31"/>

  <!-- bezel -->
  <rect x="12" y="18" width="104" height="70" rx="10" fill="url(#bezel)"/>

  <!-- screen: white field with an R/G/B test strip -->
  <g clip-path="url(#screen)">
    <rect x="18" y="24" width="92" height="58" fill="#ffffff"/>
    <rect x="87" y="24" width="23" height="19.33" fill="#e01b24"/>
    <rect x="87" y="43.33" width="23" height="19.33" fill="#33d17a"/>
    <rect x="87" y="62.66" width="23" height="19.34" fill="#3584e4"/>
    <rect x="18" y="24" width="92" height="58" fill="url(#glow)"/>
  </g>

  <rect x="18" y="24" width="92" height="58" rx="4" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
