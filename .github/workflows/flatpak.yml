name: Flatpak

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # updating the rolling release
      pages: write           # uploading the Pages artifact
      id-token: write
    env:
      APP_ID: io.github.SergeGris.WhiteScreen
      MANIFEST: build-aux/io.github.SergeGris.WhiteScreen.json
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # elfutils supplies eu-strip / eu-elfcompress, which flatpak-builder
          # shells out to when it splits debuginfo. Ubuntu's flatpak-builder
          # only *Recommends* it, so --no-install-recommends drops it and the
          # build dies at the very last step. The rest are host-side tools
          # flatpak-builder uses to unpack sources.
          #
          # librsvg2-common supplies gdk-pixbuf's SVG loader. `appstreamcli
          # compose` runs on the HOST and rasterises the app icon to build
          # catalog icons; without the loader it cannot read an .svg icon and
          # fails the whole build with a bare "file-read-error".
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder \
            elfutils patch xz-utils zstd unzip \
            librsvg2-common gdk-pixbuf2.0-bin
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      # GNOME runtimes go end-of-life roughly a year after release, and a stale
      # pin is easy to miss: the build keeps working for months and then the
      # runtime disappears. Surface the status in the log, and fail clearly if
      # the pinned branch is gone entirely.
      - name: Check the pinned runtime
        run: |
          set -eu
          runtime="$(python3 -c "import json,os;m=json.load(open(os.environ['MANIFEST']));print(m['runtime']+'//'+m['runtime-version'])")"
          echo "Manifest pins: $runtime"
          if ! flatpak remote-info --user flathub "$runtime"; then
            echo "::error::$runtime is not available on Flathub - update runtime-version in $MANIFEST"
            exit 1
          fi
          if flatpak remote-info --user flathub "$runtime" | grep -qi "end-of-life"; then
            echo "::warning::$runtime is end-of-life - plan a runtime bump"
          fi

      - name: Build and export to an OSTree repository
        run: |
          set -eux
          # Build outside the checkout. The manifest's app module is
          # `"type": "dir", "path": "../"`, so anything left in the repo root
          # would be copied into the build as source — including the build tree.
          flatpak-builder \
            --user --install-deps-from=flathub \
            --force-clean --disable-rofiles-fuse \
            --state-dir="$RUNNER_TEMP/fb-state" \
            --repo="$RUNNER_TEMP/repo" \
            "$RUNNER_TEMP/builddir" "$MANIFEST"
          flatpak build-update-repo "$RUNNER_TEMP/repo"

      - name: Create single-file bundle
        run: |
          set -eux
          flatpak build-bundle "$RUNNER_TEMP/repo" whitescreen.flatpak \
            "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -lh whitescreen.flatpak

      - uses: actions/upload-artifact@v5
        with:
          name: whitescreen-flatpak
          path: whitescreen.flatpak
          if-no-files-found: error

      - name: Add .flatpakrepo descriptor
        run: |
          set -eux
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${name}/"
          # Tell Pages not to run the file through Jekyll, which would ignore
          # some of the OSTree repository's files.
          touch "$RUNNER_TEMP/repo/.nojekyll"
          cat > "$RUNNER_TEMP/repo/whitescreen.flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=White Screen (continuous)
          Url=${url}
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=Continuous builds of White Screen from the default branch
          EOF
          cat "$RUNNER_TEMP/repo/whitescreen.flatpakrepo"
          echo "Repo will be served at ${url}"

      # Best-effort: turns Pages on via the API so the deploy job below can
      # succeed without anyone visiting repository settings. It fails silently
      # when the account or org policy does not permit it, in which case Pages
      # must be enabled once by hand:
      #   Settings -> Pages -> Source -> GitHub Actions
      - name: Enable GitHub Pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/repo

      # Stable URL that always serves the newest default-branch build:
      #   https://github.com/SergeGris/whitescreen/releases/download/continuous/whitescreen.flatpak
      - name: Publish rolling "continuous" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # The tag is recreated so it points at the commit just built.
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous whitescreen.flatpak \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Continuous build" \
            --notes "Automatic build of \`${GITHUB_SHA}\`.

          Preferred install (supports \`flatpak update\`):

          \`\`\`sh
          flatpak remote-add --user --no-gpg-verify whitescreen \\
              https://sergegris.github.io/whitescreen/whitescreen.flatpakrepo
          flatpak install --user whitescreen ${APP_ID}
          \`\`\`

          Or grab the bundle below for a one-off install; it does not auto-update."

  # The portable Windows build, added to the same rolling release.
  #
  # It runs after `build` rather than beside it, deliberately: that job
  # publishes the release by recreating the tag, so a Windows job uploading
  # at the same time would race it and lose its asset. Ordered, there is
  # nothing to race -- the release already exists, and this only adds to it.
  windows:
    name: Build portable Windows executable
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write        # adding to the rolling release
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only the crates without GTK in them. RUSTFLAGS has to repeat the
      # static-CRT flag from .cargo/config.toml: setting the variable
      # replaces that configuration rather than adding to it, and without it
      # the executable would need the Visual C++ redistributable installed --
      # which is the one thing a portable build must not ask for.
      - name: Build
        run: cargo build --locked --release -p whitescreen-win
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static

      # Proof that the thing actually runs on a machine that never built it.
      #
      # Every call is waited on and its output read. The executable is a
      # windowed program -- so that double-clicking it does not open a
      # terminal -- and a shell does not wait for one of those: run plainly,
      # these three would report success without having printed anything.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = '.\target\release\whitescreen.exe'
          function Check([string] $flags, [string] $expect) {
            $out = New-TemporaryFile
            $run = Start-Process -FilePath $exe -ArgumentList $flags -Wait -PassThru `
                     -NoNewWindow -RedirectStandardOutput $out
            if ($run.ExitCode -ne 0) { throw "$flags exited $($run.ExitCode)" }
            $text = Get-Content $out -Raw
            Write-Host $text
            if ($text -notmatch $expect) { throw "$flags did not print $expect" }
            Remove-Item $out
          }
          Check '--version' 'whitescreen'
          Check '--help' 'Usage'
          Check '--list-monitors --json' '\['

      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\whitescreen.exe dist\
          Copy-Item README.md dist\
          Copy-Item COPYING dist\LICENSE.txt
          Compress-Archive -Path dist\* -DestinationPath whitescreen-windows-x86_64.zip
          Get-Item whitescreen-windows-x86_64.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: whitescreen-windows
          path: whitescreen-windows-x86_64.zip
          if-no-files-found: error

      # Stable URL alongside the Flatpak bundle:
      #   .../releases/download/continuous/whitescreen-windows-x86_64.zip
      - name: Add to the rolling "continuous" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload continuous whitescreen-windows-x86_64.zip --clobber

  deploy:
    name: Deploy Flatpak repository
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
